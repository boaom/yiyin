name: Android APK

on:
  push:
    branches: [android-port]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yiyin-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0